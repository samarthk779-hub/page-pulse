<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Pulse — URL Auditor</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #262a36;
    --text: #e6e8ee;
    --muted: #9aa0ac;
    --accent: #4f8cff;
    --good: #3ecf8e;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px;
    width: 100%;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 32px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #error {
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid var(--bad);
    color: var(--bad);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
  }
  .report {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .report-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 16px;
  }
  .report-row:last-child { border-bottom: none; }
  .label { color: var(--muted); font-size: 14px; }
  .value { text-align: right; font-size: 14px; max-width: 60%; word-break: break-word; }
  .status-ok { color: var(--good); font-weight: 600; }
  .status-bad { color: var(--bad); font-weight: 600; }
  #loading { color: var(--muted); display: none; margin-bottom: 20px; }
  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Page Pulse</h1>
  <p class="subtitle">Audit any URL: status, speed, SEO basics, and accessibility gaps.</p>

  <form id="audit-form">
    <input type="text" id="url-input" placeholder="https://example.com" autocomplete="off" />
    <button type="submit" id="submit-btn">Audit</button>
  </form>

  <div id="loading">Auditing…</div>
  <div id="error"></div>

  <div class="report" id="report"></div>
</main>

<footer>
  Built for <a href="https://digitalheroesco.com" target="_blank" rel="noopener">Digital Heroes Training Task</a>
</footer>

<script>
const form = document.getElementById('audit-form');
const input = document.getElementById('url-input');
const btn = document.getElementById('submit-btn');
const loading = document.getElementById('loading');
const errorBox = document.getElementById('error');
const reportBox = document.getElementById('report');

function resetUI() {
  errorBox.style.display = 'none';
  reportBox.style.display = 'none';
  errorBox.textContent = '';
  reportBox.innerHTML = '';
}

function row(label, value) {
  return `<div class="report-row"><span class="label">${label}</span><span class="value">${value}</span></div>`;
}

function renderReport(data) {
  const statusClass = data.http_status >= 200 && data.http_status < 400 ? 'status-ok' : 'status-bad';
  reportBox.innerHTML =
    row('URL', data.final_url) +
    row('HTTP Status', `<span class="${statusClass}">${data.http_status}</span>`) +
    row('Response Time', `${data.response_time_ms} ms`) +
    row('Title', data.title || '<em>missing</em>') +
    row('Meta Description', data.meta_description || '<em>missing</em>') +
    row('H1 Count', data.h1_count) +
    row('Images (total)', data.image_count) +
    row('Images Missing Alt Text', data.images_missing_alt) +
    row('Approx. Word Count', data.word_count);
  reportBox.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  resetUI();
  const url = input.value.trim();
  if (!url) return;

  btn.disabled = true;
  loading.style.display = 'block';

  try {
    const res = await fetch('/api/audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.error || `Request failed (${res.status})`;
      errorBox.style.display = 'block';
    } else {
      renderReport(data);
    }
  } catch (err) {
    errorBox.textContent = 'Network error — could not reach the audit service.';
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
});
</script>
</body>
</html>
